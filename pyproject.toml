[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peppar-fix"
version = "0.1.0"
description = "GNSS-disciplined precision clock using carrier-phase PPP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Bob Van Valzah"},
]

dependencies = [
    "numpy",
    # scipy: hard import-time dependency of the engine via ppp_ar.py /
    # lambda_ar.py (AR / LAMBDA) and peppar_fix.kalman_servo.  Was
    # undeclared — a fresh `pip install -e .` produced an engine that
    # ImportError'd on `from scipy.stats import norm` (caught provisioning
    # PiPuss 2026-06-08).
    "scipy",
    # >=1.2.57 required for ZED-X20P (PROTVER 50.x): 1.2.57 added the
    # X20P HPG 2.00 NAV payload definitions (NAV-PVT/SAT/SIG/TIMEGPS).
    # Earlier releases (1.2.52/1.2.55) misframe the newer messages and
    # UBXReader.read() HANGS for minutes on an X20P stream, holding the
    # serial port — see memory reference_zed_x20p_pipuss_bringup.
    "pyubx2>=1.2.57",
    "pyserial",
    "pyrtcm>=1.1.0",
    # geo_frames: NAD83(2011)<->ITRF2020 datum/epoch conversion.
    # Needs the bundled PROJ >= 9.0 for ITRF2020 (pyproj 3.6+ ships it).
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Lab-hardware host deps: smbus2 = I2C (ClockMatrix TDC / AD5693R DAC);
# gpiod = GPIO for the TADD divider ARM pin.  gpiod is a Linux-only
# C-extension (marker keeps non-Linux dev installs from failing on it).
timebeat = ["smbus2", "gpiod; sys_platform == 'linux'"]
analysis = ["allantools", "matplotlib", "pandas"]
# peppar-mon — status display (scaffold in peppar_mon/).  Textual is the
# only dep; no numpy/pyubx2/etc.  The monitor reads log files produced by
# the engine and is explicitly forbidden from importing peppar_fix — see
# peppar_mon/tests/test_boundary.py for the enforcement.
mon = ["textual>=0.50"]
# peppar-survey base-discovery deps.  hatanaka de-compresses the RINEX-3
# Hatanaka (.crx.gz) obs the EUREF nrt archive serves for --baseline; a
# plain gunzip leaves a .crx rnx2rtkp can't read.  (PRIDE/RTKLIB binaries
# are built separately by scripts/install_peppar_survey.sh, not pip.)
survey = ["hatanaka>=2.8"]
dev = ["pytest", "pyflakes", "peppar-fix[analysis,timebeat,mon,survey]"]

# Entry points — these become CLI commands after `pip install`.
# Not yet functional: requires the import refactor (all bare imports
# like `from solve_ppp import ...` must become `from peppar_fix.solve_ppp
# import ...`).  For now, run scripts directly from a repo checkout.
#
# [project.scripts]
# peppar-fix-engine = "peppar_fix.peppar_fix_engine:main"
# peppar-fix-bootstrap = "peppar_fix.phc_bootstrap:main"
# peppar-fix-configure = "peppar_fix.configure_f9t:main"
# peppar-rx-config = "peppar_fix.peppar_rx_config:main"

[tool.setuptools.packages.find]
where = ["scripts", "."]
include = ["peppar_fix*", "peppar_mon*"]

[tool.setuptools.package-data]
peppar_fix = ["*.toml"]

[tool.pytest.ini_options]
# Both real test homes.  The bulk of the suite is co-located with the
# modules under test in scripts/peppar_fix/ (test_foo.py next to foo.py —
# the dominant convention here, ~121 files); tests/ holds the rest.
# Listing BOTH makes a path-less invocation (`pytest`, `pytest -k foo`)
# collect the whole suite — previously testpaths=["tests"] silently
# dropped scripts/peppar_fix/ on any flagged run (the bin/test scope
# gotcha that mis-scoped PR #187/#190 verification claims).
# NOT "scripts": that dir also holds 3 stale, never-collected test files
# (scripts/test_peer_*.py / test_lambda_ar.py) that fail to import
# (peppar_bus) — wiring them in would turn the suite red.  Tracked
# separately as orphanedScriptsTests.
testpaths = ["scripts/peppar_fix", "tests"]
