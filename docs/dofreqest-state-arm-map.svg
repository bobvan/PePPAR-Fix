<path d="M190,208 C330.0,208 330.0,210 468,210" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#armhead)" opacity="0.85"/>
<path d="M190,272 C330.0,272 330.0,350 468,350" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#armhead)" opacity="0.85"/>
<path d="M190,336 C330.0,336 330.0,350 468,350" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#armhead)" opacity="0.85"/>
<path d="M190,400 C330.0,400 330.0,350 468,350" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#armhead)" opacity="0.85"/>
<path d="M190,464 C330.0,464 330.0,120 468,120" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#armhead)" opacity="0.85"/>
<path d="M190,464 C330.0,464 330.0,340 468,340" fill="none" stroke="#1565c0" stroke-width="1.6" marker-end="url(#armhead)" opacity="0.85"/>
<path d="M700,210 C728,210 728,110 700,110" fill="none" stroke="#6a1b9a" stroke-width="2" marker-end="url(#dynhead)"/>
<text x="736" y="164.0" font-size="10" fill="#6a1b9a">∫ f_rx·dt</text>
<path d="M700,450 C728,450 728,350 700,350" fill="none" stroke="#6a1b9a" stroke-width="2" marker-end="url(#dynhead)"/>
<text x="736" y="404.0" font-size="10" fill="#6a1b9a">∫ (f_do+adjfine)·dt</text>
<rect x="510" y="504" width="150" height="32" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.8"/>
<text x="585" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#ef6c00">adjfine = −f_do (PHC steer)</text>
<path d="M510,482.0 L540,504" fill="none" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#acthead)" stroke-dasharray="4 2"/>
<path d="M660,520 C770,520 790,374 700,374" fill="none" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#acthead)" stroke-dasharray="4 2"/>
