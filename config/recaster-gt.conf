# PePPAR-Fix — our own NTRIP re-casters on gt.
#
# UNLIKE ntrip.conf, this file carries NO credentials, so it lives in the
# repo.  The gt mounts are open (str2str `ntripc` with no user:pass) and are
# LAN-only — they are not resolvable or reachable from outside.
#
# It is deliberately NOT named ntrip*.conf: .gitignore ignores that whole
# pattern as a blanket credential guard, and that guard is worth more than
# the naming symmetry.  Do not add credentials to this file — if a mount
# ever needs auth, put it in an ntrip*.conf and point ssr_ntrip_conf at it.
#
# This section is the SSR corrections stream.  Broadcast ephemeris is a
# SEPARATE mount on a SEPARATE port, because str2str serves one mount per
# port; select it from the per-host TOML rather than from here:
#
#     ntrip_conf   = "config/recaster-gt.conf"
#     eph_caster   = "eph.ntrip.VanValzah.Com"
#     eph_port     = 2103
#     eph_mount    = "BCEP"
#     ntrip_http10 = true          # str2str speaks NTRIP v1, not v2
#
# ntrip_http10 is REQUIRED here.  str2str answers "ICY 200 OK\r\n" and then
# streams RTCM immediately with no blank line; an HTTP/1.1 client reads RTCM
# bytes into the header and mis-frames the stream.
#
# Mount inventory (see docs/local-caster-onocoy-plan.md):
#   ssr.ntrip.VanValzah.Com:2101/SSR    orbit + clock + code bias (SSRA03IGS0)
#   obs.ntrip.VanValzah.Com:2102/PTBB   UTC(PTB)-clocked reference observations
#   eph.ntrip.VanValzah.Com:2103/BCEP   broadcast ephemeris (from BRUX in-band)

[ntrip]
caster = ssr.ntrip.VanValzah.Com
port = 2101
mount = SSR
tls = false
