[peppar]
# F9T EVKs share one USB descriptor (no unique serial), so udev can't
# make a stable name and /dev/ttyACMx is fragile (enumeration shifts
# when any USB device is added/removed).  Bind to the physical USB
# port via /dev/serial/by-path — only breaks if the F9T's USB cable
# is moved to a different port.  See docs/lab-operations.md §12.
serial = "/dev/serial/by-path/platform-xhci-hcd.1-usb-0:2:1.0"
baud = 115200
ubx_port = "USB"
# Receiver swapped F9T-L5 -> ZED-F9P on PATCH3 2026-06-03 (roadtrip);
# same physical USB port so the by-path serial above still resolves.
# NOTE: F9P is L1/L2 (not L5) — L5/B2a-I SSR-AR assumptions differ.
receiver = "f9t"  # [2026-06-30] F9T-20B (ex-MadHat) replaced the F9P
# No ptp_dev — the engine does not use the CM4's PHC.
# ts2phc disciplines bcm_phy_ptp from DO PPS on SYNC_IN independently.

# ── Corrections from our own re-casters on gt ────────────────────────────────
# SSR + broadcast ephemeris come from the gt relays rather than the public
# casters.  str2str's ntripc speaks NTRIP v1 ("ICY 200 OK", no blank line after
# the status line), so ntrip_http10 is REQUIRED — without it the client reads
# RTCM bytes into the header and mis-frames the stream.
#
# eph is a separate caster/port from SSR because str2str serves one mount per
# port.  Verified from this host 2026-08-25: all three mounts return ICY 200 OK
# and real RTCM3.
#
# To fall back to the public casters, restore:
#   ntrip_conf = "ntrip.conf"; eph_mount = "BCEP00BKG0"; ssr_ntrip_conf = "ntrip.conf"
# and drop eph_caster / eph_port / ntrip_http10.
ntrip_conf   = "config/recaster-gt.conf"   # ssr.ntrip.VanValzah.Com:2101/SSR
eph_caster   = "eph.ntrip.VanValzah.Com"
eph_port     = 2103
eph_mount    = "BCEP"
ntrip_http10 = true
systems = "gps,gal,bds"

# Operational ARP — engine reads timelab/antennas.json[ufo1] at
# startup as an in-memory survey-class seed candidate.  Read-only;
# only peppar-survey writes state/positions/<uid>.survey.toml.
# UFO1 restored 2026-05-19 (CHOKE1 swap-out); see antennas.json.
arp_label = "ufo1"  # [2026-07-22] back in Wheaton on UFO1

# IsoTemp OCXO131-100 (ex-MadHat) via AD5693R DAC on I2C bus 1, 2x output mode.
# Swapped in 2026-06-30, replacing the CTI OSC5A2B02 + TADD-2 that was here
# (CTI char archived: gt/do-char-archive/ocxo-piface-CTI-OSC5A2B02-TADD2-saved-20260630/).
# AUTHORITATIVE characterization = state/dos/isotemp-ocxo131-100-madhat.toml
# (measured [steering] ~0.0262 ppb/code, code range [5000,50000], dac_gain 1;
# freerun sigma_do_phase 0.0564 ns). The engine uses that measured steering;
# the dac_* values below are non-authoritative fallbacks kept consistent with it.
# 2x gain is REQUIRED for the IsoTemp OCXO (part expects 0..5V Vctrl).
do_label = "isotemp-ocxo131-100-madhat"
do_type = "vcocxo"
dac_bus = 1
dac_addr = "0x4C"
dac_bits = 16
dac_gain = 1
dac_ppb_per_code = "0.02617"
dac_max_ppb = 725.3
dac_type = "ad5693r"

# TADD-2 Mini divider: ARM on GPIO 16, syncs 10 MHz → 1 PPS.
tadd_gpio = 16

# Loop-BW: LQR phase-loop gain L[2].  -0.01 (corner ~100 s) from the 2026-07-25
# overnight A/B/C/D sweep (4 gains -0.05/-0.01/-0.003/-0.001, 3 cycles, 45-min
# arms).  -0.001 wins mid-τ but -0.003 and -0.001 BLOW UP at long τ (τ512 RMS
# 13-14 ns vs -0.01's 2.3 ns) — too-low BW lets the DO drift off GPS.  -0.01 is
# the mid-τ-vs-long-τ balance, and matches PiPuss's optimum — both hosts are
# IsoTemp OCXO + F9T-20 on the shared UFO1 antenna, so the corner is pinned by
# the shared long-τ GPS-tracking constraint.  See docs/gnssdo-servo-loop-bandwidth.md.
lqr_phase_gain = -0.01

# pifaceShortTauGlitches mitigation (docs/piface-shorttau-glitches-2026-05-29.md).
# The v1 OCXO gate rejects 99.6% of TICC here (the GNSS-PPS carrier), so the loop
# runs open between corrections and the DO drifts far; the catch-up lands as a
# large sporadic freq kick (≤16.7 ppb measured) that kinks chA by up to 341 ns,
# putting NEAR(±8 s of a kick) TDEV(1s) 188× above the QUIET floor.  Clamp the
# per-epoch adjfine change to bound the kink injection.  2 ppb sits ~10× above
# the empirical p95 normal correction (0.19 ppb) — no impact on the 99 % of
# clean corrections, but every one of the 80 overnight kicks (range 0.5-16.7
# ppb) is bounded.  Band-aid until the gate redesign lands (routedQErrArm #79
# / disciplineModeFsm).  Engine L3 rate limit; engages only after the first
# adjfine, so bootstrap is unaffected.
max_adjfine_step_ppb = 2.0

# TICC #3: chA = DO PPS, chB = GNSS PPS.
# TICC competes as a servo source whenever ticc_port is configured.
ticc_port = "/dev/ticc2"  # [2026-06-30] TICC #2 (ex-MadHat) now on PiFace

# RINEX archival for offline PRIDE comparison + peppar-survey --pride.
# Decimation to 30 s matches PRIDE/RTKLIB standard input; engine
# continues to consume RAWX at 1 Hz for its own PPP filter.
rinex_out = "data/rinex/{host}-{date}.obs"
rinex_decimate_s = 30.0
