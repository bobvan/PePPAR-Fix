[peppar]
# PiPuss — RECOMMISSIONED as a CLOCK host 2026-06-30 (pre-London "round 2"
# peripheral swap), mirroring PiFace: F9T-20 receiver + IsoTemp-class OCXO
# disciplined oscillator + per-clock TICC.  Supersedes the prior
# receiver-only ZED-X20P config (the X20P was pulled; that config lives in
# git history — restore it when the X20P lands on a host again).
#
# Peripherals moved onto PiPuss 2026-06-30 (verified present by inventory):
#   - F9T-20B receiver (ex-PiFace; USB 1546:01a9 → /dev/gnss-bot/ttyACM1)
#   - DO: OCXO + AD5693R DAC + PulsePuppy + divider (ex-clkPoC3); the DAC
#     answers at i2c-1 0x4C and the DO characterization (do_label below)
#     travelled with the board — valid because the DAC+OCXO moved as a unit.
#   - TICC #5 (ex-clkPoC3; Arduino serial 44236313835351406232 → /dev/ticc5
#     via the udev rule added 2026-06-30 to timelab/99-timelab.rules)
#   - NEW OCXO temperature sensor at i2c-1 0x48 (auto-read by the engine's
#     TempSensor(bus_num=1); no config field needed — logged as [TEMP_C]).
#
# ⚠ NOT YET BROUGHT UP — verify at first launch: /dev/gnss-bot really is the
#   F9T (USB-path symlink from the old dual-F9T era), /dev/ticc5 symlink
#   resolves after the udev reload, the divider GPIO (tadd_gpio) and the
#   AD5693R gain jumper match this board, and the DAC actually steers.

# F9T-20B on the "bot" USB path (single u-blox now; X20P removed).
serial = "/dev/gnss-bot"
baud = 115200
ubx_port = "USB"
receiver = "f9t"

ntrip_conf = "ntrip.conf"
eph_mount = "BCEP00BKG0"
# CNES SSRA00CNE0 removed from IGS-IP 2026-06-28 -> BKG SSRA00BKG0 (float);
# BKG SSRA00BKG0 retired 2026-07-22 -> IGS-RTS combined SSRA03IGS0 (float,
# same GA caster).  SSR mount lives in ntrip.conf (host-local).

ssr_ntrip_conf = "ntrip.conf"
systems = "gps,gal,bds"

# Operational ARP — engine reads timelab/antennas.json[ufo1] as an in-memory
# survey-class seed (shared lab antenna via the GUS splitter).
arp_label = "ufo1"

# Disciplined oscillator — characterization travelled from clkPoC3 with the
# board (state/dos/ocxo-clkpoc3.*).  NOTE: "ocxo-clkpoc3" is a host-named
# misnomer now that the DO lives on PiPuss (logged in docs/misnomers.md);
# kept as-is to preserve the char linkage — rename deliberately later.
# The MEASURED [steering] in the .toml is authoritative over these dac_*
# values (measuredSteeringIsAuthoritative, #187); these mirror clkPoC3.
do_label = "ocxo-clkpoc3"
do_type = "vcocxo"
dac_bus = 1
dac_addr = "0x4C"
dac_bits = 16
dac_gain = 1
dac_ppb_per_code = "0.02309"
dac_max_ppb = 740.0
dac_type = "ad5693r"
tadd_gpio = 16

ticc_port = "/dev/ticc5"

rinex_out = "data/rinex/{host}-{date}.obs"
rinex_decimate_s = 30.0
